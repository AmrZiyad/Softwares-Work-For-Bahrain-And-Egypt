<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — King's School The Crown Egypt</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; min-height: 100vh; background: #f0f2f5;
    }

    /* Left panel */
    .left-panel {
      width: 400px; flex-shrink: 0;
      background: linear-gradient(160deg, #0a1628 0%, #1a2f5a 60%, #0d1f3c 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 48px 32px; position: relative; overflow: hidden;
    }
    .left-panel::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 50%, rgba(196,30,58,0.15) 0%, transparent 60%);
    }
    .logo-wrap { position: relative; z-index: 1; text-align: center; }
    .logo-wrap img {
      width: 160px; height: 160px; object-fit: cover;
      border-radius: 50%; border: 3px solid rgba(255,255,255,0.2);
      background: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .logo-fallback {
      width: 160px; height: 160px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      display: flex; align-items: center; justify-content: center;
      font-size: 72px;
    }
    .school-name {
      margin-top: 24px; font-size: 22px; font-weight: 800;
      color: #ffffff; letter-spacing: 0.5px; line-height: 1.2;
      text-align: center;
    }
    .school-name span { display: block; font-size: 13px; font-weight: 400;
      color: rgba(255,255,255,0.55); margin-top: 3px; letter-spacing: 2px;
      text-transform: uppercase; }
    .badge {
      margin-top: 32px; display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 8px 18px;
      font-size: 13px; color: rgba(255,255,255,0.75);
    }
    .badge::before { content: '✓'; color: #4ade80; font-weight: 700; }

    /* Right panel */
    .right-panel {
      flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px;
    }
    .login-card {
      background: #ffffff; border-radius: 20px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.10);
      padding: 48px 44px; width: 100%; max-width: 420px;
    }
    .login-card h1 { font-size: 28px; font-weight: 700; color: #0a1628; margin-bottom: 6px; }
    .login-card .subtitle { font-size: 14px; color: #6b7280; margin-bottom: 32px; }

    label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
      text-transform: uppercase; color: #374151; margin-bottom: 8px; }
    input[type=text], input[type=password] {
      width: 100%; padding: 13px 16px; border: 1.5px solid #e5e7eb;
      border-radius: 10px; font-size: 15px; color: #111827;
      background: #f9fafb; outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: #c41e3a; box-shadow: 0 0 0 3px rgba(196,30,58,0.12); background: #fff; }
    .form-group { margin-bottom: 20px; }

    .alert-error {
      background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px;
      padding: 12px 16px; font-size: 14px; color: #dc2626;
      margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
    }
    .alert-error::before { content: '✕'; font-weight: 700; }

    .btn-signin {
      width: 100%; padding: 14px; background: #c41e3a;
      border: none; border-radius: 10px; color: #fff;
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: background .2s, transform .1s;
      margin-top: 8px;
    }
    .btn-signin:hover { background: #a01830; }
    .btn-signin:active { transform: scale(0.99); }

    @media (max-width: 720px) {
      .left-panel { display: none; }
      body { background: #0a1628; }
      .right-panel { padding: 20px; align-items: flex-start; padding-top: 60px; }
      .login-card { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="left-panel">
    <div class="logo-wrap">
      <img
        src="/static/img/logo.png"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
        alt="King's School Logo"
        id="schoolLogo">
      <div class="logo-fallback" style="display:none;">👑</div>
    </div>
    <div class="school-name">
      King's School The Crown
      <span>HR &amp; Payroll System</span>
    </div>
    <div class="badge">Est. The Crown Egypt</div>
  </div>

  <div class="right-panel">
    <div class="login-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to King's School system</p>

      {% if error %}
        <div class="alert-error">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" autofocus autocomplete="username"
                 required placeholder="Enter your username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" autocomplete="current-password"
                 required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-signin">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
